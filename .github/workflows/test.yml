name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and pipeline tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      # Uses generated fixture saves; tests that need the installed game are skipped.
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
